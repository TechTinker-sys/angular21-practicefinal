<section class="mx-auto max-w-3xl px-4 py-14 sm:px-6 lg:px-8 lg:py-20">
  <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm dark:border-slate-800 dark:bg-slate-950 sm:p-10">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.3em] text-sky-600 dark:text-sky-400">Notes</p>
        <h1 class="mt-2 text-3xl font-extrabold tracking-tight text-slate-950 dark:text-white sm:text-4xl">Create a note</h1>
        <p class="mt-3 text-sm leading-6 text-slate-600 dark:text-slate-400">Add a new note to the Express API.</p>
      </div>
      <a
        routerLink="/notes"
        class="inline-flex items-center gap-2 rounded-full border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
      >
        ← Back to notes
      </a>
    </div>

    <form [formGroup]="noteForm" (ngSubmit)="submitNote()" class="mt-8 space-y-5">
      <div>
        <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Title</label>
        <input
          formControlName="title"
          type="text"
          class="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200 dark:border-slate-800 dark:bg-slate-900 dark:text-white"
        />
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Content</label>
        <textarea
          formControlName="content"
          rows="6"
          class="mt-2 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200 dark:border-slate-800 dark:bg-slate-900 dark:text-white"
        ></textarea>
      </div>

      <div *ngIf="error()" class="rounded-2xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700 dark:border-rose-900 dark:bg-rose-950/40 dark:text-rose-300">
        {{ error() }}
      </div>

      <div class="flex gap-3">
        <button
          type="submit"
          [disabled]="submitting()"
          class="inline-flex items-center justify-center rounded-full bg-sky-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-sky-700 disabled:cursor-not-allowed disabled:opacity-50"
        >
          {{ submitting() ? 'Creating…' : 'Create note' }}
        </button>
        <a
          routerLink="/notes"
          class="inline-flex items-center justify-center rounded-full border border-slate-300 bg-white px-6 py-3 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
        >
          Cancel
        </a>
      </div>
    </form>
  </div>
</section>
