<section class="mx-auto max-w-3xl px-4 py-14 sm:px-6 lg:px-8 lg:py-20">
  <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm dark:border-slate-800 dark:bg-slate-950 sm:p-10">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.3em] text-rose-600 dark:text-rose-400">Notes</p>
        <h1 class="mt-2 text-3xl font-extrabold tracking-tight text-slate-950 dark:text-white sm:text-4xl">Delete note</h1>
        <p class="mt-3 text-sm leading-6 text-slate-600 dark:text-slate-400">Confirm that you want to permanently delete this note.</p>
      </div>
      <a
        routerLink="/notes"
        class="inline-flex items-center gap-2 rounded-full border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
      >
        ← Back to notes
      </a>
    </div>

    <div *ngIf="loading()" class="mt-8 rounded-2xl border border-slate-200 bg-slate-50 p-6 text-center text-sm text-slate-600 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-300">
      Loading note…
    </div>

    <div *ngIf="error() && !loading()" class="mt-8 rounded-2xl border border-rose-200 bg-rose-50 p-6 text-center text-sm text-rose-700 dark:border-rose-900 dark:bg-rose-950/40 dark:text-rose-300">
      {{ error() }}
    </div>

    <div *ngIf="!loading() && note()" class="mt-8 space-y-6">
      <div class="rounded-3xl border border-rose-200 bg-rose-50 p-6 dark:border-rose-900 dark:bg-rose-950/40">
        <h2 class="text-lg font-semibold text-slate-950 dark:text-white">{{ note()?.title }}</h2>
        <p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-400">{{ note()?.content }}</p>
        <p class="mt-4 text-xs uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400">Updated: {{ note()?.updatedAt }}</p>
      </div>

      <div *ngIf="error()" class="rounded-2xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700 dark:border-rose-900 dark:bg-rose-950/40 dark:text-rose-300">
        {{ error() }}
      </div>

      <div class="flex gap-3">
        <button
          type="button"
          (click)="deleteNote()"
          [disabled]="deleting()"
          class="inline-flex items-center justify-center rounded-full bg-rose-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-rose-700 disabled:cursor-not-allowed disabled:opacity-50"
        >
          {{ deleting() ? 'Deleting…' : 'Delete note' }}
        </button>
        <a
          routerLink="/notes"
          class="inline-flex items-center justify-center rounded-full border border-slate-300 bg-white px-6 py-3 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
        >
          Cancel
        </a>
      </div>
    </div>
  </div>
</section>
